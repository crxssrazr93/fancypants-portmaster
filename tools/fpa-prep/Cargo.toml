[package]
name = "fpa-prep"
version = "0.1.0"
edition = "2021"
description = "Converts Fancy Pants Adventures World 4 ATF textures to PNG for the Ruffle-based PortMaster port"

[dependencies]
jpegxr = { git = "https://github.com/ruffle-rs/jpegxr", rev = "86cc1749d493288f53d7290ac3eb7082c475b5d9" }
lzma-rs = "0.3"
texture2ddecoder = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
